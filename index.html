<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Come Home to Each Other</title>
<meta name="description" content="A daily bridge between a mother and her daughter. One small question in the morning, one small thank you at night.">
<meta name="theme-color" content="#4A3728">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Each Other">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --walnut: #4A3728;
    --cedar: #8B7355;
    --amber: #C4A87E;
    --linen: #F7F3ED;
    --earth: #2D2418;
    --drift: #D4C5A9;
    --white: #FFFDF9;
    --mum: #8B7355;     /* cedar - mum's colour */
    --daughter: #C4A87E; /* amber - daughter's colour */
    --shadow-rest: 0 2px 16px rgba(45,36,24,0.06);
    --shadow-hover: 0 8px 30px rgba(74,55,40,0.14);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: 'Work Sans', sans-serif;
    font-weight: 300;
    color: var(--earth);
    background: #E9E2D6;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .font-h { font-family: 'Cormorant Garamond', serif; font-weight: 400; }
  em { font-style: italic; }

  /* ===== phone shell (demos nicely on desktop, invisible on mobile) ===== */
  .shell {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--linen);
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 60px rgba(45,36,24,0.18);
  }
  @media (min-width: 500px) {
    body { padding: 28px 0; }
    .shell { min-height: calc(100vh - 56px); border-radius: 34px; overflow: hidden; }
  }

  /* ===== wattle background ===== */
  .bg-wattle {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: url('wattle.jpg') center top / 430px auto repeat;
    opacity: 0.12;
  }
  header, main, nav { position: relative; z-index: 1; }

  /* ===== celebration layer ===== */
  #fx {
    position: absolute; inset: 0; pointer-events: none; z-index: 60;
  }

  /* ===== header ===== */
  header {
    background: var(--walnut);
    color: var(--linen);
    padding: 22px 22px 18px;
    text-align: center;
    position: relative;
  }
  header .brand {
    font-family: 'Work Sans', sans-serif; font-weight: 500;
    font-size: .6rem; letter-spacing: .3em; text-transform: uppercase;
    color: var(--amber);
  }
  header h1 { font-family:'Cormorant Garamond',serif; font-weight:400; font-size: 1.55rem; line-height:1.15; margin-top: 6px; }
  header h1 em { color: var(--amber); }

  /* role switch */
  .role-switch {
    display: flex; justify-content: center; gap: 8px; margin-top: 14px;
  }
  .role-btn {
    font-family: 'Work Sans', sans-serif; font-weight: 500; font-size: .78rem;
    letter-spacing: .06em; padding: 8px 20px; border-radius: 30px;
    border: 1px solid rgba(212,197,169,0.4); background: transparent;
    color: var(--drift); cursor: pointer; transition: all .3s var(--ease);
  }
  .role-btn.active { background: var(--amber); color: var(--walnut); border-color: var(--amber); font-weight: 600; }

  /* ===== main ===== */
  main { flex: 1; padding: 24px 20px 96px; }
  .screen { display: none; animation: rise .45s var(--ease); }
  .screen.active { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .date-line {
    text-align: center; font-family:'Cormorant Garamond',serif; font-style: italic;
    font-size: 1rem; color: var(--cedar); margin-bottom: 18px;
  }

  .sprig { display:block; margin: 0 auto; }
  .sprig path { stroke: var(--cedar); stroke-width: 1.1; fill:none; stroke-linecap: round; }

  /* cards */
  .card {
    background: var(--white); border: 0.7px solid rgba(139,115,85,0.16);
    border-radius: 14px; padding: 22px 20px; margin-bottom: 16px;
    box-shadow: var(--shadow-rest);
  }
  .card-tag {
    font-family:'Work Sans',sans-serif; font-weight:500; font-size:.62rem;
    letter-spacing:.26em; text-transform: uppercase; color: var(--amber);
    display:block; margin-bottom: 8px;
  }
  .card h2 { font-family:'Cormorant Garamond',serif; font-weight:400; color: var(--walnut); font-size: 1.45rem; line-height: 1.25; margin-bottom: 12px; }
  .card h2 em { color: var(--cedar); }
  .card p.hint { font-size: .85rem; color: #6b5d4a; margin-bottom: 12px; }

  textarea {
    width: 100%; min-height: 96px; resize: vertical;
    font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; line-height: 1.55;
    color: var(--earth); background: var(--linen);
    border: 0.7px solid rgba(139,115,85,0.25); border-radius: 10px;
    padding: 14px 15px; transition: border-color .3s var(--ease);
  }
  textarea:focus { outline: none; border-color: var(--amber); }
  textarea::placeholder { color: #a8977d; font-style: italic; }

  .save-btn {
    margin-top: 12px; width: 100%;
    background: var(--walnut); color: var(--linen);
    font-family:'Work Sans',sans-serif; font-weight: 500; font-size: .92rem; letter-spacing:.04em;
    padding: 14px; border: none; border-radius: 10px; cursor: pointer;
    transition: all .3s var(--ease);
  }
  .save-btn:hover { background: var(--earth); }
  .save-btn.saved { background: var(--cedar); }
  .save-btn:disabled { opacity: .55; cursor: default; }

  /* saved entry display */
  .entry-done {
    background: rgba(212,197,169,0.18); border-radius: 10px; padding: 15px 16px;
    font-family:'Cormorant Garamond',serif; font-size: 1.12rem; line-height: 1.5; color: var(--walnut);
  }
  .entry-done .edit-link, .card.nudge .edit-link {
    display:inline-block; margin-top: 8px; font-family:'Work Sans',sans-serif;
    font-size: .72rem; letter-spacing:.1em; text-transform: uppercase; color: var(--cedar);
    background:none; border:none; cursor:pointer; text-decoration: underline; text-underline-offset: 3px;
  }

  .locked {
    text-align:center; font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size: 1rem; color: #a8977d; padding: 8px 10px 2px;
  }

  /* ===== bridge screen ===== */
  .bridge-pair { margin-bottom: 22px; }
  .bridge-title {
    text-align:center; font-family:'Work Sans',sans-serif; font-weight:500;
    font-size:.64rem; letter-spacing:.26em; text-transform:uppercase; color: var(--cedar);
    margin-bottom: 12px;
  }
  .bubble { border-radius: 14px; padding: 16px 18px; margin-bottom: 10px; max-width: 92%; position: relative; }
  .bubble .who {
    font-family:'Work Sans',sans-serif; font-weight:600; font-size:.66rem;
    letter-spacing:.14em; text-transform:uppercase; margin-bottom: 5px; display:block;
  }
  .bubble .words { font-family:'Cormorant Garamond',serif; font-size: 1.14rem; line-height: 1.5; }
  .bubble.mum { background: rgba(139,115,85,0.13); border: 0.7px solid rgba(139,115,85,0.25); margin-right:auto; }
  .bubble.mum .who { color: var(--cedar); }
  .bubble.daughter { background: rgba(196,168,126,0.16); border: 0.7px solid rgba(196,168,126,0.4); margin-left:auto; text-align:right; }
  .bubble.daughter .who { color: #a8865a; }
  .bubble.empty { background: transparent; border: 1px dashed rgba(139,115,85,0.3); }
  .bubble.empty .words { color: #a8977d; font-style: italic; font-size: .95rem; }

  /* ===== journey ===== */
  .day-block { margin-bottom: 26px; }
  .day-head {
    font-family:'Cormorant Garamond',serif; font-size: 1.2rem; color: var(--walnut);
    border-bottom: 0.7px solid rgba(139,115,85,0.25); padding-bottom: 6px; margin-bottom: 12px;
  }
  .day-head span { font-style: italic; color: var(--cedar); font-size: .95rem; }
  .mini { border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: .95rem; }
  .mini .who { font-weight: 500; font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; display:block; }
  .mini.mum { background: rgba(139,115,85,0.1); }
  .mini.mum .who { color: var(--cedar); }
  .mini.daughter { background: rgba(196,168,126,0.13); }
  .mini.daughter .who { color: #a8865a; }
  .mini .w { font-family:'Cormorant Garamond',serif; font-size: 1.05rem; color: var(--earth); }
  .journey-empty { text-align:center; padding: 30px 10px; }
  .journey-empty p { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.1rem; color:#a8977d; margin-bottom: 18px; }
  .ghost-btn {
    background: none; border: 1px solid var(--cedar); color: var(--cedar);
    font-family:'Work Sans',sans-serif; font-weight:500; font-size:.8rem; letter-spacing:.05em;
    padding: 11px 24px; border-radius: 30px; cursor:pointer; transition: all .3s var(--ease);
  }
  .ghost-btn:hover { background: var(--cedar); color: var(--linen); }

  /* ===== setup ===== */
  .setup-hero { text-align: center; padding: 10px 4px 6px; }
  .setup-hero h2 { font-family:'Cormorant Garamond',serif; font-weight:400; font-size: 1.9rem; color: var(--walnut); line-height:1.15; margin: 14px 0 10px; }
  .setup-hero h2 em { color: var(--cedar); }
  .setup-hero p { font-size: .95rem; color:#5d5140; max-width: 19rem; margin: 0 auto 22px; }
  .setup-field { margin-bottom: 14px; text-align: left; }
  .setup-field label {
    display:block; font-family:'Work Sans',sans-serif; font-weight:500; font-size:.68rem;
    letter-spacing:.2em; text-transform:uppercase; color: var(--cedar); margin-bottom: 6px;
  }
  .setup-field input {
    width:100%; padding: 14px 16px; border-radius: 10px;
    border: 0.7px solid rgba(139,115,85,0.28); background: var(--white);
    font-family:'Cormorant Garamond',serif; font-size: 1.15rem; color: var(--earth);
  }
  .setup-field input:focus { outline:none; border-color: var(--amber); }

  /* ===== bottom nav ===== */
  nav {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: var(--white); border-top: 0.7px solid rgba(139,115,85,0.18);
    display: flex; padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
  }
  nav button {
    flex: 1; background: none; border: none; cursor: pointer;
    font-family: 'Work Sans', sans-serif; font-weight: 500; font-size: .62rem;
    letter-spacing: .12em; text-transform: uppercase; color: #a8977d;
    padding: 6px 2px; transition: color .3s var(--ease);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  nav button svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  nav button.active { color: var(--walnut); }

  nav button { position: relative; }
  nav button.has-new::after {
    content: ''; position: absolute; top: 2px; left: calc(50% + 8px);
    width: 8px; height: 8px; border-radius: 50%; background: #E7C878;
    box-shadow: 0 0 0 2px var(--white);
  }
  .card.nudge { border: 0.7px solid rgba(196,168,126,0.55); }
  .card.nudge .edit-link { display: inline-block; margin-top: 12px; }
  .join-row { margin-top: 18px; text-align: center; }
  .join-row .edit-link { background: none; border: none; font-family: inherit; font-size: .82rem; color: var(--cedar); text-decoration: underline; cursor: pointer; }
  .join-row .setup-field { margin-top: 12px; display: none; }
  .join-row.open .setup-field { display: block; }

  .toast {
    position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
    background: var(--walnut); color: var(--linen); font-size: .85rem;
    padding: 11px 22px; border-radius: 30px; opacity: 0; pointer-events: none;
    transition: all .4s var(--ease); white-space: nowrap; box-shadow: var(--shadow-hover);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="shell">
  <div class="bg-wattle"></div>
  <canvas id="fx"></canvas>

  <header>
    <span class="brand">Come Home to Each Other</span>
    <h1 id="headline">A daily bridge, <em>between you</em></h1>
    <div class="role-switch" id="roleSwitch" style="display:none;">
      <button class="role-btn" id="roleMum" onclick="setRole('mum')">Mum</button>
      <button class="role-btn" id="roleDaughter" onclick="setRole('daughter')">Daughter</button>
    </div>
  </header>

  <main>

    <!-- ============ SETUP ============ -->
    <div class="screen" id="screen-setup">
      <div class="setup-hero">
        <svg class="sprig" width="90" height="44" viewBox="0 0 120 58">
          <path d="M10,29 C40,29 80,29 110,29"/>
          <path d="M34,29 C34,18 42,12 52,13 C46,20 40,26 34,29"/>
          <path d="M34,29 C34,40 42,46 52,45 C46,38 40,32 34,29"/>
          <path d="M58,29 C58,17 67,10 78,11 C71,19 64,25 58,29"/>
          <path d="M58,29 C58,41 67,48 78,47 C71,39 64,33 58,29"/>
          <path d="M82,29 C82,19 90,13 99,14 C93,21 87,26 82,29"/>
          <path d="M82,29 C82,39 90,45 99,44 C93,37 87,32 82,29"/>
        </svg>
        <h2>Two of you.<br>One small ritual, <em>every day.</em></h2>
        <p>A question in the morning. A thank you at night. Written apart, shared together - so you truly see each other, every single day.</p>
        <div class="setup-field">
          <label for="inMum">Mum's name</label>
          <input type="text" id="inMum" placeholder="e.g. Jacqui">
        </div>
        <div class="setup-field">
          <label for="inDaughter">Daughter's name</label>
          <input type="text" id="inDaughter" placeholder="e.g. Ella">
        </div>
        <button class="save-btn" onclick="saveSetup()">Begin your bridge</button>
        <div class="join-row" id="joinRow">
          <button class="edit-link" onclick="document.getElementById('joinRow').classList.add('open')">Been invited? Paste your invite link</button>
          <div class="setup-field">
            <input type="text" id="inJoin" placeholder="Paste the link you were sent" autocapitalize="off" autocorrect="off">
            <button class="ghost-btn" style="margin-top:10px;" onclick="joinFromPaste()">Join the bridge</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ TODAY ============ -->
    <div class="screen" id="screen-today">
      <div class="date-line" id="todayDate"></div>
      <div id="todayCards"></div>
    </div>

    <!-- ============ BRIDGE ============ -->
    <div class="screen" id="screen-bridge">
      <div class="date-line" id="bridgeDate"></div>
      <div id="bridgeBody"></div>
    </div>

    <!-- ============ JOURNEY ============ -->
    <div class="screen" id="screen-journey">
      <div class="date-line">Your bridge so far</div>
      <div id="journeyBody"></div>
    </div>

  </main>

  <nav id="mainNav" style="display:none;">
    <button id="nav-today" onclick="go('today')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      Today
    </button>
    <button id="nav-bridge" onclick="go('bridge')">
      <svg viewBox="0 0 24 24"><path d="M3 17c3-6 6-9 9-9s6 3 9 9"/><path d="M3 17h18"/><path d="M7.5 17v-4.2M12 17V8.5M16.5 17v-4.2"/></svg>
      The Bridge
    </button>
    <button id="nav-journey" onclick="go('journey')">
      <svg viewBox="0 0 24 24"><path d="M4 19.5V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v13.5"/><path d="M4 19.5a2 2 0 0 0 2 2h14"/><path d="M9 8h6M9 12h6"/></svg>
      Journey
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
  /* ================= state ================= */
  const KEY = 'chte-data-v1';
  let data = load();
  let role = localStorage.getItem('chte-role') || null;

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || blank(); }
    catch { return blank(); }
  }
  function blank() { return { mumName: '', daughterName: '', entries: {} }; }
  function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

  /* ================= sync settings =================
     The only lines that change when the app moves to another Supabase project. */
  const SYNC = {
    url: 'https://jiquevvzrdavgqonvvug.supabase.co',
    key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppcXVldnZ6cmRhdmdxb252dnVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NzIxNzIsImV4cCI6MjA4NzU0ODE3Mn0.e4mYjXj8TGTC0_UCm3QCKGSv8Cl-migIl7reYIKNcW4',
    vapid: 'BB7gzOzDH8ATXyWArkU25psBec1ram5tjb9U7tgseKYCESMk53dWH0V03XP1FBxr1x4OPn5OvtxnAI3rvAuWYS4'
  };
  let token = localStorage.getItem('chte-token') || null;   // the pair's secret - whoever holds it is on the bridge
  let pending = [];
  try { pending = JSON.parse(localStorage.getItem('chte-pending')) || []; } catch { pending = []; }
  let current = 'setup';

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function niceDate(key) {
    const [y,m,d] = key.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString('en-AU', { weekday:'long', day:'numeric', month:'long' });
  }
  function entryFor(key) {
    if (!data.entries[key]) data.entries[key] = { morning:{mum:'',daughter:''}, evening:{mum:'',daughter:''} };
    return data.entries[key];
  }
  function name(r) { return r === 'mum' ? (data.mumName || 'Mum') : (data.daughterName || 'Daughter'); }
  function otherRole(r) { return r === 'mum' ? 'daughter' : 'mum'; }

  /* prompts */
  const PROMPTS = {
    morning: {
      mum:      { tag: 'This morning', q: 'What would you <em>love</em> for ' + '__D__' + ' today?', ph: 'I would love for you to...' },
      daughter: { tag: 'This morning', q: 'What do you want <em>Mum to know</em> today?', ph: 'Mum, today I want you to know...' }
    },
    evening: {
      mum:      { tag: 'Tonight', q: 'What did you <em>appreciate</em> about ' + '__D__' + ' today?', ph: 'Today I appreciated...' },
      daughter: { tag: 'Tonight', q: 'What did you <em>appreciate</em> about Mum today?', ph: 'Mum, today I appreciated...' }
    }
  };
  function promptText(part, r) {
    return PROMPTS[part][r].q.replace('__D__', '<span style="white-space:nowrap;">' + esc(name('daughter')) + '</span>');
  }
  function esc(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* ================= render ================= */
  function go(screen) {
    current = screen;
    if (screen === 'bridge') { localStorage.removeItem('chte-unseen'); document.getElementById('nav-bridge').classList.remove('has-new'); }
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + screen).classList.add('active');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    const nb = document.getElementById('nav-' + screen);
    if (nb) nb.classList.add('active');
    if (screen === 'today') renderToday();
    if (screen === 'bridge') renderBridge();
    if (screen === 'journey') renderJourney();
  }

  function setRole(r) {
    role = r;
    localStorage.setItem('chte-role', r);
    document.getElementById('roleMum').classList.toggle('active', r === 'mum');
    document.getElementById('roleDaughter').classList.toggle('active', r === 'daughter');
    document.getElementById('roleMum').textContent = data.mumName || 'Mum';
    document.getElementById('roleDaughter').textContent = data.daughterName || 'Daughter';
    renderToday();
    if (token) { keepUrl(); syncSub(); }
  }

  function saveSetup() {
    const m = document.getElementById('inMum').value.trim();
    const d = document.getElementById('inDaughter').value.trim();
    if (!m || !d) { toast('Pop both names in first'); return; }
    data.mumName = m; data.daughterName = d;
    save();
    if (token) rpc('chte_set_names', { p_token: token, p_mum: m, p_daughter: d }).catch(() => {});
    boot();
    toast('Welcome, ' + m + ' & ' + d);
  }

  function renderToday() {
    if (!role) return;
    document.getElementById('todayDate').textContent = niceDate(todayKey());
    const e = entryFor(todayKey());
    const hour = new Date().getHours();
    const parts = hour < 15 ? ['morning','evening'] : ['evening','morning'];
    let html = nudgeCards();
    for (const part of parts) {
      const p = PROMPTS[part][role];
      const val = e[part][role];
      html += '<div class="card">';
      html += '<span class="card-tag">' + p.tag + ' &middot; for ' + esc(name(role)) + '</span>';
      html += '<h2>' + promptText(part, role) + '</h2>';
      if (val && !window['editing_' + part]) {
        html += '<div class="entry-done">&ldquo;' + esc(val) + '&rdquo;<br><button class="edit-link" onclick="window.editing_' + part + '=true;renderToday()">Change it</button></div>';
      } else {
        html += '<textarea id="ta-' + part + '" placeholder="' + p.ph + '">' + esc(val) + '</textarea>';
        html += '<button class="save-btn" onclick="saveEntry(\'' + part + '\')">Place it on the bridge</button>';
      }
      html += '</div>';
    }
    html += '<p class="locked">Written in your own time, seen on The Bridge.</p>';
    document.getElementById('todayCards').innerHTML = html;
  }

  function saveEntry(part) {
    const ta = document.getElementById('ta-' + part);
    const v = ta.value.trim();
    if (!v) { toast('Write a little something first'); return; }
    const e = entryFor(todayKey());
    e[part][role] = v;
    window['editing_' + part] = false;
    save();
    queueSend(todayKey(), part, role, v);
    renderToday();
    const pairDone = e[part].mum && e[part].daughter;
    if (pairDone) {
      celebrate(true);
      toast('Your words met on the bridge');
    } else {
      celebrate(false);
      toast('Placed on the bridge - ' + name(otherRole(role)) + '’s turn');
    }
  }

  /* ================= celebration: chime + wattle fireworks ================= */
  let audioCtx = null;
  function playDing(big) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const notes = big ? [659.25, 830.61, 987.77] : [659.25, 987.77]; // E5, G#5, B5
      notes.forEach((f, i) => {
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        const t = audioCtx.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(big ? 0.22 : 0.16, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + (big ? 1.1 : 0.7));
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 1.2);
      });
    } catch (err) { /* sound is a bonus, never block the save */ }
  }

  const GOLDS = ['#C4A87E', '#E7C878', '#F2D98D', '#8B7355', '#D4C5A9'];
  let fxParticles = [];
  let fxRunning = false;
  function sizeFx() {
    const c = document.getElementById('fx');
    const s = document.querySelector('.shell');
    c.width = s.clientWidth; c.height = s.clientHeight;
  }
  window.addEventListener('resize', sizeFx);

  function spawnBurst(cx, cy, count, spread) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (0.5 + Math.random()) * spread;
      fxParticles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.2,
        r: 2 + Math.random() * 3.2,
        c: GOLDS[Math.floor(Math.random() * GOLDS.length)],
        life: 1
      });
    }
  }
  function fxLoop() {
    const c = document.getElementById('fx');
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    fxParticles = fxParticles.filter(p => p.life > 0);
    for (const p of fxParticles) {
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.12;           // soft gravity
      p.vx *= 0.985;
      p.life -= 0.016;
      const alive = Math.max(p.life, 0);
      ctx.globalAlpha = alive;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * alive, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (fxParticles.length) requestAnimationFrame(fxLoop);
    else { fxRunning = false; ctx.clearRect(0, 0, c.width, c.height); }
  }
  function celebrate(big) {
    playDing(big);
    sizeFx();
    const c = document.getElementById('fx');
    const cx = c.width / 2, cy = c.height * 0.42;
    spawnBurst(cx, cy, big ? 55 : 26, big ? 5.5 : 4);
    if (big) {
      setTimeout(() => { spawnBurst(cx * 0.55, cy * 0.75, 30, 4.5); if (!fxRunning) { fxRunning = true; fxLoop(); } }, 220);
      setTimeout(() => { spawnBurst(cx * 1.45, cy * 1.1, 30, 4.5); if (!fxRunning) { fxRunning = true; fxLoop(); } }, 420);
    }
    if (!fxRunning) { fxRunning = true; fxLoop(); }
  }

  function bubble(r, words, part) {
    const whoLabel = esc(name(r));
    if (words) {
      return '<div class="bubble ' + r + '"><span class="who">' + whoLabel + '</span><div class="words">&ldquo;' + esc(words) + '&rdquo;</div></div>';
    }
    return '<div class="bubble ' + r + ' empty"><span class="who">' + whoLabel + '</span><div class="words">' + whoLabel + ' hasn’t placed ' + (part === 'morning' ? 'this morning’s words' : 'tonight’s words') + ' yet</div></div>';
  }

  function renderBridge() {
    document.getElementById('bridgeDate').textContent = niceDate(todayKey());
    const e = entryFor(todayKey());
    let html = '';
    html += '<div class="bridge-pair"><div class="bridge-title">This morning</div>';
    html += bubble('mum', e.morning.mum, 'morning');
    html += bubble('daughter', e.morning.daughter, 'morning');
    html += '</div>';
    html += '<div class="bridge-pair"><div class="bridge-title">Tonight</div>';
    html += bubble('mum', e.evening.mum, 'evening');
    html += bubble('daughter', e.evening.daughter, 'evening');
    html += '</div>';
    const total = [e.morning.mum, e.morning.daughter, e.evening.mum, e.evening.daughter].filter(Boolean).length;
    if (total === 4) {
      html += '<p class="locked">The bridge is complete today. Well done, both of you.</p>';
    }
    document.getElementById('bridgeBody').innerHTML = html;
  }

  function renderJourney() {
    const keys = Object.keys(data.entries).sort().reverse().filter(k => {
      const e = data.entries[k];
      return e.morning.mum || e.morning.daughter || e.evening.mum || e.evening.daughter;
    });
    let html = '';
    if (!keys.length) {
      html = '<div class="journey-empty"><p>Your journey starts with today’s first words.</p>' +
             '<button class="ghost-btn" onclick="seedExample()">Show me an example day</button></div>';
    } else {
      for (const k of keys) {
        const e = data.entries[k];
        html += '<div class="day-block"><div class="day-head">' + niceDate(k) + '</div>';
        if (e.morning.mum) html += mini('mum', 'morning', e.morning.mum);
        if (e.morning.daughter) html += mini('daughter', 'morning', e.morning.daughter);
        if (e.evening.mum) html += mini('mum', 'tonight', e.evening.mum);
        if (e.evening.daughter) html += mini('daughter', 'tonight', e.evening.daughter);
        html += '</div>';
      }
    }
    html += '<div style="text-align:center; margin-top:30px; padding-top:18px; border-top:0.7px solid rgba(139,115,85,0.18); display:flex; flex-direction:column; gap:10px; align-items:center;">' +
            (token ? '<button class="ghost-btn" onclick="sendInvite()">Send the invite link again</button>' : '') +
            (token ? '<button class="ghost-btn" onclick="setRole(otherRole(role)); renderJourney(); toast(\'This phone is now \' + name(role) + \'’s\')">This is ' + esc(name(role)) + '’s phone - switch to ' + esc(name(otherRole(role))) + '</button>' : '') +
            '<button class="ghost-btn" onclick="changeNames()">Change our names</button>' +
            '<button class="ghost-btn" id="resetBtn" onclick="startOver()" style="border-color:rgba(139,115,85,0.4); color:#a8977d;">Start over from scratch</button>' +
            '</div>';
    document.getElementById('journeyBody').innerHTML = html;
  }

  function changeNames() {
    document.getElementById('inMum').value = data.mumName;
    document.getElementById('inDaughter').value = data.daughterName;
    go('setup');
    toast('Fix the names, then tap Begin');
  }

  let resetArmed = false;
  function startOver() {
    const btn = document.getElementById('resetBtn');
    if (!resetArmed) {
      resetArmed = true;
      btn.textContent = token ? 'Tap again - this clears every word on both phones' : 'Tap again - this clears your names and all your words';
      btn.style.borderColor = '#a8674e';
      btn.style.color = '#a8674e';
      setTimeout(() => {
        resetArmed = false;
        if (document.getElementById('resetBtn')) renderJourney();
      }, 5000);
      return;
    }
    if (token) {
      rpc('chte_delete_pair', { p_token: token })
        .then(() => { resetArmed = false; clearThisPhone(); toast('Fresh start'); })
        .catch(() => { resetArmed = false; renderJourney(); toast('You’re offline - try again in a moment'); });
      return;
    }
    clearThisPhone();
    toast('Fresh start');
  }
  function clearThisPhone() {
    ['chte-token','chte-pending','chte-unseen','chte-invite-hidden','chte-push-hidden', KEY, 'chte-role'].forEach(k => localStorage.removeItem(k));
    token = null; pending = [];
    unsubscribePush();
    history.replaceState(null, '', location.pathname);
    data = blank();
    role = null;
    resetArmed = false;
    document.getElementById('roleSwitch').style.display = 'none';
    document.getElementById('mainNav').style.display = 'none';
    document.getElementById('headline').innerHTML = 'A daily bridge, <em>between you</em>';
    document.getElementById('inMum').value = '';
    document.getElementById('inDaughter').value = '';
    go('setup');
  }
  function mini(r, when, words) {
    return '<div class="mini ' + r + '"><span class="who">' + esc(name(r)) + ' &middot; ' + when + '</span><span class="w">&ldquo;' + esc(words) + '&rdquo;</span></div>';
  }

  function seedExample() {
    const d = new Date(); d.setDate(d.getDate() - 1);
    const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    data.entries[k] = {
      morning: {
        mum: 'I would love for you to walk into that maths test knowing you have already done the hard part.',
        daughter: 'I want you to know I am nervous about today but I am trying.'
      },
      evening: {
        mum: 'The way you kept going this afternoon even when you were tired. I saw it.',
        daughter: 'That you made my favourite dinner without me asking. It made today better.'
      }
    };
    save();
    renderJourney();
    toast('Example day added');
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ================= two-phone sync ================= */
  async function rpc(fn, args) {
    const r = await fetch(SYNC.url + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: SYNC.key, Authorization: 'Bearer ' + SYNC.key, 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    });
    if (!r.ok) throw new Error(fn + ' ' + r.status);
    return r.json();
  }

  /* the address bar always carries the pair + whose phone this is, so Add to Home Screen keeps the connection */
  function keepUrl() {
    if (token && role) history.replaceState(null, '', location.pathname + '?k=' + token + '&as=' + role);
  }
  function linkFor(r) { return location.origin + location.pathname + '?k=' + token + '&as=' + r; }

  function readJoinLink(href) {
    let q;
    try { q = new URL(href || location.href).searchParams; } catch { return false; }
    const k = q.get('k'), as = q.get('as');
    if (!k || !/^[a-f0-9]{32}$/.test(k)) return false;
    if (k !== token) {                       // joining a bridge this phone has not seen before
      token = k;
      localStorage.setItem('chte-token', k);
      data = blank(); save();
      pending = []; localStorage.removeItem('chte-pending');
      role = null;
    }
    if (!role && (as === 'mum' || as === 'daughter')) { role = as; localStorage.setItem('chte-role', as); }
    return true;
  }
  function joinFromPaste() {
    const v = document.getElementById('inJoin').value.trim();
    if (!readJoinLink(v)) { toast('That doesn’t look like an invite link'); return; }
    boot();
  }

  async function ensurePair() {
    if (token || !data.mumName || !data.daughterName) return;
    try {
      token = await rpc('chte_create_pair', { p_mum: data.mumName, p_daughter: data.daughterName });
      localStorage.setItem('chte-token', token);
      for (const day of Object.keys(data.entries)) for (const part of ['morning','evening']) for (const r of ['mum','daughter']) {
        const w = data.entries[day][part][r];
        if (w) pending.push({ day, part, role: r, words: w, quiet: true });
      }
      localStorage.setItem('chte-pending', JSON.stringify(pending));
      keepUrl();
      renderToday();
      flush();
    } catch (err) { /* offline - still works on this phone, tries again next time it opens */ }
  }

  function queueSend(day, part, r, words) {
    if (!token) return;
    pending = pending.filter(p => !(p.day === day && p.part === part && p.role === r));
    pending.push({ day, part, role: r, words });
    localStorage.setItem('chte-pending', JSON.stringify(pending));
    flush(true);
  }
  let flushing = false;
  async function flush(tellMe) {
    if (flushing || !token || !pending.length) return;
    flushing = true;
    try {
      while (pending.length) {
        const p = pending[0];
        const ok = await rpc('chte_save_entry', { p_token: token, p_day: p.day, p_part: p.part, p_role: p.role, p_words: p.words });
        pending.shift();
        localStorage.setItem('chte-pending', JSON.stringify(pending));
        if (ok && !p.quiet) notifyOther(p);
      }
    } catch (err) {
      if (tellMe) setTimeout(() => toast('Saved on this phone - it will send when you’re back online'), 2400);
    }
    flushing = false;
  }
  function notifyOther(p) {
    fetch(SYNC.url + '/functions/v1/chte-notify', {
      method: 'POST', keepalive: true,
      headers: { apikey: SYNC.key, Authorization: 'Bearer ' + SYNC.key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, role: p.role, part: p.part, url: './?k=' + token + '&as=' + otherRole(p.role) })
    }).catch(() => {});
  }

  let pulling = false;
  async function pull(quiet) {
    if (pulling || !token) return;
    pulling = true;
    try {
      const res = await rpc('chte_get', { p_token: token });
      if (res === null) {                    // the other phone chose "start over", or the link is wrong
        clearThisPhone();
        toast('This bridge was cleared. Begin again whenever you’re ready.');
        pulling = false; return;
      }
      const firstLoad = !data.mumName;
      const namesChanged = res.mumName !== data.mumName || res.daughterName !== data.daughterName;
      data.mumName = res.mumName; data.daughterName = res.daughterName;
      let fresh = null;
      for (const e of res.entries) {
        if (pending.some(p => p.day === e.day && p.part === e.part && p.role === e.role)) continue; // my newer words are still on their way
        const slot = entryFor(e.day)[e.part];
        if (slot[e.role] !== e.words) {
          slot[e.role] = e.words;
          if (e.role !== role) fresh = e;
        }
      }
      save();
      if (firstLoad) { pulling = false; boot(true); return; }
      if (namesChanged) showNames();
      if (fresh) {
        localStorage.setItem('chte-invite-hidden', '1');     // they are clearly on the bridge now
        if (current === 'bridge') renderBridge();
        else {
          localStorage.setItem('chte-unseen', '1');
          document.getElementById('nav-bridge').classList.add('has-new');
          if (current === 'journey') renderJourney();
        }
        if (!quiet) {
          const e = entryFor(fresh.day)[fresh.part];
          playDing(!!(e.mum && e.daughter));
          toast(name(fresh.role) + ' placed words on the bridge');
        }
      }
    } catch (err) { /* offline - keep showing what this phone already has */ }
    pulling = false;
  }

  /* ================= invite + notification cards ================= */
  function nudgeCards() {
    if (!token) return '';
    let html = '';
    const other = esc(name(otherRole(role)));
    if (!localStorage.getItem('chte-invite-hidden')) {
      html += '<div class="card nudge"><span class="card-tag">One more step</span>' +
              '<h2>Invite <em>' + other + '</em> to the bridge</h2>' +
              '<p class="hint">Send ' + other + ' the link. Opened on their own phone, it connects the two of you, and your words travel between you.</p>' +
              '<button class="save-btn" onclick="sendInvite()">Send the invite</button><br>' +
              '<button class="edit-link" onclick="localStorage.setItem(\'chte-invite-hidden\',\'1\');renderToday()">Done - hide this</button></div>';
    }
    const st = pushState();
    if (st && !localStorage.getItem('chte-push-hidden')) {
      html += '<div class="card nudge"><span class="card-tag">Stay close</span>' +
              '<h2>Know the moment <em>' + other + '</em> writes</h2>';
      if (st === 'ios-install') {
        html += '<p class="hint">On iPhone: tap the Share button below, choose <em>Add to Home Screen</em>, then open the app from your home screen and turn notifications on there.</p>';
      } else {
        html += '<p class="hint">A gentle notification on this phone when new words are waiting. It never shows the words themselves.</p>' +
                '<button class="save-btn" onclick="enablePush()">Turn on notifications</button><br>';
      }
      html += '<button class="edit-link" onclick="localStorage.setItem(\'chte-push-hidden\',\'1\');renderToday()">Not now</button></div>';
    }
    return html;
  }

  async function sendInvite() {
    if (!token) return;
    const other = otherRole(role);
    const url = linkFor(other);
    const text = name(role) + ' has invited you to Come Home to Each Other - one small question in the morning, one small thank you at night, just for the two of you. Open this on your phone:';
    try {
      if (navigator.share) { await navigator.share({ title: 'Come Home to Each Other', text, url }); return; }
    } catch (err) { if (err && err.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text + ' ' + url); toast('Invite copied - paste it in a message'); }
    catch (err) { toast('Copy the link from the address bar'); }
  }

  /* ================= notifications ================= */
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  let swReg = null;

  function pushState() {
    if (isIOS && !isStandalone) return 'ios-install';
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return null;
    return Notification.permission === 'default' ? 'ask' : null;
  }
  function b64ToBytes(b64) {
    const pad = '='.repeat((4 - b64.length % 4) % 4);
    const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  }
  async function enablePush() {
    try {
      const perm = await Notification.requestPermission();   // must be the first thing after the tap (iPhone rule)
      if (perm !== 'granted') { localStorage.setItem('chte-push-hidden', '1'); renderToday(); return; }
      await syncSub();
      renderToday();
      toast('Notifications are on');
    } catch (err) { toast('Couldn’t turn notifications on'); }
  }
  let subJob = null;   // one registration at a time, or the phone signs up twice and buzzes twice
  function syncSub() {
    if (subJob) return subJob;
    subJob = (async () => {
      if (!token || !role || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      const r = role;
      try {
        const reg = swReg || await navigator.serviceWorker.ready;
        let sub = await reg.pushManager.getSubscription();
        if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(SYNC.vapid) });
        const j = sub.toJSON();
        await rpc('chte_save_sub', { p_token: token, p_role: r, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
      } catch (err) { /* notifications are a bonus, never block the app */ }
      if (r !== role) setTimeout(syncSub, 0);   // the phone changed hands while we were registering
    })().finally(() => { subJob = null; });
    return subJob;
  }
  async function unsubscribePush() {
    try {
      const reg = swReg || await navigator.serviceWorker.getRegistration();
      const sub = reg && await reg.pushManager.getSubscription();
      if (sub) await sub.unsubscribe();
    } catch (err) {}
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
    navigator.serviceWorker.addEventListener('message', e => { if (e.data === 'chte-pull') pull(); });
  }

  /* ================= boot ================= */
  function showNames() {
    document.getElementById('headline').innerHTML = esc(data.mumName) + ' <em>&amp;</em> ' + esc(data.daughterName);
    document.getElementById('roleMum').textContent = data.mumName || 'Mum';
    document.getElementById('roleDaughter').textContent = data.daughterName || 'Daughter';
  }
  function boot(afterPull) {
    readJoinLink();
    if (!data.mumName || !data.daughterName) {
      if (token && !afterPull) {             // opened an invite link - fetch the bridge first
        document.getElementById('headline').innerHTML = 'Finding <em>your bridge</em>...';
        pull(true).then(() => { if (!data.mumName) { go('setup'); if (token) toast('Couldn’t reach the bridge - check your connection'); } });
        return;
      }
      go('setup');
      return;
    }
    // once two phones are paired, each phone belongs to one person - no switcher
    document.getElementById('roleSwitch').style.display = token ? 'none' : 'flex';
    document.getElementById('mainNav').style.display = 'flex';
    showNames();
    if (!role) role = 'mum';
    setRole(role);
    if (localStorage.getItem('chte-unseen')) document.getElementById('nav-bridge').classList.add('has-new');
    go('today');
    if (token) { flush(); if (!afterPull) pull(true); }   // setRole above already kept the address + notification registration
    else ensurePair().then(() => { if (token) document.getElementById('roleSwitch').style.display = 'none'; });
  }
  boot();

  document.addEventListener('visibilitychange', () => { if (!document.hidden) { flush(); pull(); } });
  window.addEventListener('online', () => { flush(); pull(); });
  setInterval(() => { if (!document.hidden) { flush(); pull(); } }, 20000);
</script>
</body>
</html>
